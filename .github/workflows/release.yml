name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          print(f"validated release tag {tag}")
          PY

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Install and smoke-test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          autoops --version
          autoops preflight . --json
          autoops disk . --json
          autoops environment --json

      - name: Extract changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\](?:[^\n]*)\n(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no release section for {version}")
          notes = match.group("body").strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md release section for {version} is empty")
          pathlib.Path("release-notes.md").write_text(notes + "\n")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --title "AutoOPS ${{ github.ref_name }}" --notes-file release-notes.md
