name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tagged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          print(f"validated release tag {tag}")
          PY

      - name: Install test and build tooling
        run: python -m pip install --upgrade pip pytest build twine
      - name: Install project
        run: python -m pip install -e .
      - name: Run full test suite
        run: python -m pytest -q
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          autoops --version
          autoops preflight . --json
          autoops-artifact pyproject.toml --min-size-bytes 1 --json --fail-on-unhealthy
      - name: Extract changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          pattern = re.compile(rf"^## \[{re.escape(version)}\](?:[^\n]*)\n(?P<body>.*?)(?=^## \[|\Z)", re.MULTILINE | re.DOTALL)
          match = pattern.search(changelog)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no release section for {version}")
          notes = match.group("body").strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md release section for {version} is empty")
          pathlib.Path("release-notes.md").write_text(notes + "\n")
          PY
      - name: Preserve validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: autoops-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve validated release notes
        uses: actions/upload-artifact@v7
        with:
          name: autoops-release-notes-${{ github.sha }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: autoops-release-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: autoops-release-notes-${{ github.sha }}
          path: release-metadata
      - name: Publish validated GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --title "AutoOPS ${{ github.ref_name }}" --notes-file release-metadata/release-notes.md
